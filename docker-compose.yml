# The bot plus a Cloudflare WARP proxy, for servers whose IP address is blocked by
# YouTube/TikTok (most VPS providers). Works with `docker compose up -d` and as
# a Coolify "Docker Compose" application.
#
# Settings come from the environment (Coolify: the application's Environment
# Variables; locally: a .env file next to this file). Required: BOT_TOKEN, plus
# TELEGRAM_API_ID and TELEGRAM_API_HASH for the local Bot API server (from
# https://my.telegram.org, "API development tools"; keep them secret).
services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      STORAGE_CHAT_ID: ${STORAGE_CHAT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_USER_DOWNLOADS: ${MAX_USER_DOWNLOADS:-5}
      MAX_TOTAL_DOWNLOADS: ${MAX_TOTAL_DOWNLOADS:-100}
      # yt-dlp's traffic goes through the warp service below.
      YTDLP_PROXY: ${YTDLP_PROXY:-socks5://warp:1080}
      # The bot's own web requests (Pinterest, X, previews) go through WARP too,
      # because sites serve server IPs stripped-down pages. Set FETCH_PROXY to an
      # empty value to turn this off.
      # (Deliberately not HTTPS_PROXY: Coolify passes variables to image builds,
      # and Docker would then try to pull base images through "warp".)
      FETCH_PROXY: ${FETCH_PROXY-socks5://warp:1080}
      # The bot talks to Telegram through the local Bot API server below: an
      # upload only has to reach that container, which sends it on to Telegram
      # over Telegram's own protocol. Before the first start with it, log the bot
      # out of api.telegram.org once: run "bot logout-cloud" in this container.
      # Set TELEGRAM_API_URL to an empty value to use api.telegram.org again
      # (possible 10 minutes after the log-out).
      TELEGRAM_API_URL: ${TELEGRAM_API_URL-http://telegram-bot-api:8081}
      # Only used without the local server: api.telegram.org through WARP, since
      # from some servers it answers every getUpdates with "502 Bad Gateway".
      # "bot logout-cloud" uses it too.
      TELEGRAM_PROXY: ${TELEGRAM_PROXY-socks5://warp:1080}
      # PO tokens for YouTube from the pot service below; without them YouTube
      # answers "Requested format is not available" even with cookies. Set to
      # an empty value to turn it off.
      YTDLP_POT_URL: ${YTDLP_POT_URL-http://pot:4416}
      # Optional cookies.txt paths inside the container (needs a volume added to
      # this file). Empty means "not used".
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      INSTAGRAM_COOKIES: ${INSTAGRAM_COOKIES:-}
      REDDIT_COOKIES: ${REDDIT_COOKIES:-}
      # Or the cookies.txt contents, base64-encoded, so no file mount is needed
      # (Coolify: add as a secret environment variable). Use one form, not both.
      YTDLP_COOKIES_B64: ${YTDLP_COOKIES_B64:-}
      INSTAGRAM_COOKIES_B64: ${INSTAGRAM_COOKIES_B64:-}
      REDDIT_COOKIES_B64: ${REDDIT_COOKIES_B64:-}
    depends_on:
      warp:
        condition: service_healthy
      pot:
        condition: service_started
      telegram-bot-api:
        condition: service_started

  # Telegram's Bot API server, run locally (https://github.com/tdlib/telegram-bot-api).
  # It logs in as the bot and connects to Telegram directly. No ports are
  # published: anyone who could reach it could run their own bots on your
  # api_id. TELEGRAM_LOCAL raises the upload limit from 50 MB to 2000 MB. The
  # volume keeps its login, so restarts don't log the bot in again.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.5
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID (my.telegram.org, API development tools)}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH (my.telegram.org, API development tools)}
      TELEGRAM_LOCAL: "1"
    # Coolify hands every service all of the app's variables (overriding values
    # set here), and this image turns TELEGRAM_PROXY, meant for the bot, into its
    # webhook --proxy option, with which it fails to start. So drop it before
    # the image's own entrypoint runs.
    entrypoint: ["/bin/sh", "-c", "unset TELEGRAM_PROXY; exec /docker-entrypoint.sh"]
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  # Generates YouTube PO tokens for yt-dlp's bgutil plugin. yt-dlp tells it to
  # use its own proxy (WARP), so the tokens match the address YouTube sees.
  # No ports are published: it has no authentication, so only the bot may
  # reach it, over the compose network. Keep the version the same as
  # BGUTIL_VERSION in the Dockerfile.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true

  warp:
    build: ./deploy/warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      # Port 1080 is what the bot uses, so check through it (not WARP's own 40000).
      test: ["CMD-SHELL", "curl -fsS --max-time 10 --proxy socks5h://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

volumes:
  warp-data:
  telegram-bot-api-data:
